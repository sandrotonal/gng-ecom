<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim — GNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        main: ['Manrope', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="bg-black text-white font-main" data-page="contact">

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- ═══════════ SITE ═══════════ -->
    <div id="site">

        <div id="gng-nav"></div>

        <div id="gng-cart"></div>
        <div id="gng-auth"></div>

        <!-- ═══ CONTACT PAGE ═══ -->
        <section class="pt-32 pb-24 md:pt-40 md:pb-40">
            <div class="max-w-7xl mx-auto px-5 md:px-10">
                <div class="mb-12">
                    <p class="text-[9px] uppercase tracking-[0.4em] text-neutral-600 font-mono mb-3">// İletişim</p>
                    <h1 class="text-4xl md:text-6xl font-black tracking-tighter uppercase">BİZE ULAŞIN</h1>
                </div>

                <div class="grid lg:grid-cols-2 gap-12">
                    <!-- Contact Form -->
                    <div class="border border-white/5 p-6">
                        <h2 class="text-[10px] uppercase tracking-[0.3em] text-white font-bold mb-6">MESAJ GÖNDER</h2>
                        
                        <form id="contactForm" class="space-y-6">
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label class="text-neutral-500 text-xs mb-2 block">Ad</label>
                                    <input type="text" name="firstName" required placeholder="Adınız">
                                </div>
                                <div>
                                    <label class="text-neutral-500 text-xs mb-2 block">Soyad</label>
                                    <input type="text" name="lastName" required placeholder="Soyadınız">
                                </div>
                            </div>
                            <div>
                                <label class="text-neutral-500 text-xs mb-2 block">E-posta</label>
                                <input type="email" name="email" required placeholder="ornek@email.com">
                            </div>
                            <div>
                                <label class="text-neutral-500 text-xs mb-2 block">Konu</label>
                                <select name="subject" required>
                                    <option value="">Seçiniz</option>
                                    <option value="order">Sipariş Soruları</option>
                                    <option value="product">Ürün Bilgileri</option>
                                    <option value="shipping">Kargo ve Teslimat</option>
                                    <option value="return">İade ve Değişim</option>
                                    <option value="collab">İş Birliği</option>
                                    <option value="other">Diğer</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-neutral-500 text-xs mb-2 block">Mesaj</label>
                                <textarea name="message" required rows="5" placeholder="Mesajınız"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-white text-black py-4 text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-neutral-200 transition-colors">
                                Gönder
                            </button>
                        </form>
                    </div>

                    <!-- Contact Info -->
                    <div class="space-y-6">
                        <div class="border border-white/5 p-6">
                            <h2 class="text-[10px] uppercase tracking-[0.3em] text-white font-bold mb-6">İLETİŞİM BİLGİLERİ</h2>
                            
                            <div class="space-y-4">
                                <div class="flex items-start gap-4">
                                    <div class="w-10 h-10 border border-white/10 flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="mail" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-white text-sm font-bold">E-posta</p>
                                        <a href="mailto:info@gng.com" class="text-neutral-500 text-xs hover:text-white transition-colors">info@gng.com</a>
                                    </div>
                                </div>
                                <div class="flex items-start gap-4">
                                    <div class="w-10 h-10 border border-white/10 flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="phone" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-white text-sm font-bold">Telefon</p>
                                        <a href="tel:+902123456789" class="text-neutral-500 text-xs hover:text-white transition-colors">+90 212 345 67 89</a>
                                    </div>
                                </div>
                                <div class="flex items-start gap-4">
                                    <div class="w-10 h-10 border border-white/10 flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-white text-sm font-bold">Adres</p>
                                        <p class="text-neutral-500 text-xs leading-relaxed">
                                            GNG HQ<br>
                                            Moda Cad. No: 123<br>
                                            Kadıköy, İstanbul<br>
                                            Türkiye
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="border border-white/5 p-6">
                            <h2 class="text-[10px] uppercase tracking-[0.3em] text-white font-bold mb-6">ÇALIŞMA SAATLERİ</h2>
                            
                            <div class="space-y-2">
                                <div class="flex justify-between">
                                    <span class="text-neutral-500 text-xs">Pazartesi - Cuma</span>
                                    <span class="text-white text-xs font-mono">09:00 - 18:00</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-neutral-500 text-xs">Cumartesi</span>
                                    <span class="text-white text-xs font-mono">10:00 - 16:00</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-neutral-500 text-xs">Pazar</span>
                                    <span class="text-white text-xs font-mono">Kapalı</span>
                                </div>
                            </div>
                        </div>

                        <div class="border border-white/5 p-6">
                            <h2 class="text-[10px] uppercase tracking-[0.3em] text-white font-bold mb-6">SOSYAL MEDYA</h2>
                            
                            <div class="flex gap-3">
                                <a href="#" class="w-10 h-10 border border-white/10 flex items-center justify-center text-neutral-500 hover:text-white hover:border-white/30 transition-all">
                                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                                </a>
                                <a href="#" class="w-10 h-10 border border-white/10 flex items-center justify-center text-neutral-500 hover:text-white hover:border-white/30 transition-all">
                                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                                </a>
                                <a href="#" class="w-10 h-10 border border-white/10 flex items-center justify-center text-neutral-500 hover:text-white hover:border-white/30 transition-all">
                                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                                </a>
                                <a href="#" class="w-10 h-10 border border-white/10 flex items-center justify-center text-neutral-500 hover:text-white hover:border-white/30 transition-all">
                                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div id="gng-footer"></div>

    </div>

    <script src="../js/shared.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/pages.js"></script>
    <script>SHARED.init(true);</script>
</body>
</html>
