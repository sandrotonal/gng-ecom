<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — GNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{main:['Manrope','sans-serif'],mono:['Space Mono','monospace']}}}}</script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-black text-white font-main">
    <div id="toast"></div>
    <div id="site">
        <div id="gng-nav"></div>
        <div id="gng-cart"></div>
        <div id="gng-auth"></div>
        <section class="pt-32 pb-24 md:pt-40 md:pb-40 min-h-screen">
            <div class="max-w-3xl mx-auto px-5">
                <div class="reveal text-center mb-12">
                    <p class="text-[9px] uppercase tracking-[0.4em] text-neutral-500 font-mono mb-3">// Hesabım</p>
                    <h1 class="text-4xl md:text-6xl font-black tracking-tighter uppercase">PROFİL</h1>
                </div>
                <div id="profileGuest" class="reveal text-center border border-white/5 p-10">
                    <p class="text-neutral-600 text-sm mb-6">Profilinizi görüntülemek için giriş yapın</p>
                    <button onclick="openAuth()" class="bg-white text-black px-10 py-4 text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-neutral-200 transition-all">Giriş Yap</button>
                </div>
                <div id="profileContent" class="hidden">
                    <div class="grid md:grid-cols-3 gap-6 mb-10">
                        <div class="reveal border border-white/5 p-6 text-center">
                            <div id="profileAvatar" class="w-16 h-16 rounded-full bg-white text-black flex items-center justify-center text-2xl font-bold font-mono mx-auto mb-4"></div>
                            <h2 id="profileName" class="font-bold text-lg"></h2>
                            <p id="profileEmail" class="text-neutral-500 text-xs font-mono mt-1"></p>
                            <p id="profileMethod" class="text-[9px] uppercase tracking-widest text-neutral-600 font-mono mt-2"></p>
                        </div>
                        <div class="reveal border border-white/5 p-6">
                            <h3 class="text-[9px] uppercase tracking-[0.3em] text-white font-bold mb-4">Hesap</h3>
                            <ul class="space-y-3">
                                <li><button onclick="showProfileTab('orders')" class="profile-tab-btn active text-neutral-400 hover:text-white text-xs transition-colors flex items-center gap-2"><i data-lucide="package" class="w-3.5 h-3.5"></i> Siparişlerim</button></li>
                                <li><button onclick="showProfileTab('settings')" class="profile-tab-btn text-neutral-400 hover:text-white text-xs transition-colors flex items-center gap-2"><i data-lucide="settings" class="w-3.5 h-3.5"></i> Ayarlar</button></li>
                                <li><button onclick="showProfileTab('addresses')" class="profile-tab-btn text-neutral-400 hover:text-white text-xs transition-colors flex items-center gap-2"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Adreslerim</button></li>
                            </ul>
                        </div>
                        <div class="reveal border border-white/5 p-6">
                            <h3 class="text-[9px] uppercase tracking-[0.3em] text-white font-bold mb-4">İşlemler</h3>
                            <div class="space-y-3">
                                <button onclick="authLogout()" class="text-neutral-500 hover:text-red-400 text-xs transition-colors flex items-center gap-2"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Çıkış Yap</button>
                                <button onclick="if(confirm('Sepetiniz ve tüm verileriniz silinecek. Emin misiniz?')){localStorage.clear();location.reload();}" class="text-neutral-600 hover:text-red-400 text-[10px] transition-colors flex items-center gap-2"><i data-lucide="trash-2" class="w-3 h-3"></i> Tüm Verileri Sil</button>
                            </div>
                        </div>
                    </div>
                    <div id="profileTabOrders" class="profile-tab reveal border border-white/5 p-6">
                        <h3 class="text-[9px] uppercase tracking-[0.3em] text-white font-bold mb-6">SİPARİŞ GEÇMİŞİ</h3>
                        <div id="profileOrderList" class="space-y-3"></div>
                    </div>
                    <div id="profileTabSettings" class="profile-tab hidden reveal border border-white/5 p-6">
                        <h3 class="text-[9px] uppercase tracking-[0.3em] text-white font-bold mb-6">HESAP AYARLARI</h3>
                        <div class="space-y-4 max-w-sm">
                            <div>
                                <label class="text-neutral-500 text-xs mb-2 block">Ad Soyad</label>
                                <input type="text" id="profileEditName" class="w-full bg-transparent border border-white/10 px-4 py-3 text-white text-xs font-mono focus:outline-none focus:border-white/30">
                            </div>
                            <div>
                                <label class="text-neutral-500 text-xs mb-2 block">E-posta</label>
                                <input type="email" id="profileEditEmail" class="w-full bg-transparent border border-white/10 px-4 py-3 text-white text-xs font-mono focus:outline-none focus:border-white/30">
                            </div>
                            <button onclick="saveProfile()" class="bg-white text-black px-8 py-3 text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-neutral-200 transition-all">Kaydet</button>
                            <div id="profileSaveMsg" class="auth-success"></div>
                        </div>
                    </div>
                    <div id="profileTabAddresses" class="profile-tab hidden reveal border border-white/5 p-6">
                        <h3 class="text-[9px] uppercase tracking-[0.3em] text-white font-bold mb-6">ADRESLERİM</h3>
                        <div id="profileAddressList" class="space-y-3">
                            <p class="text-neutral-600 text-xs">Kayıtlı adres bulunmuyor.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div id="gng-footer"></div>
    </div>
    <script src="../js/shared.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/components.js"></script>
    <script>
        function showProfileTab(tab) {
            document.querySelectorAll('.profile-tab').forEach(function(t) { t.classList.add('hidden'); });
            document.getElementById('profileTab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
            document.querySelectorAll('.profile-tab-btn').forEach(function(b) { b.classList.remove('active'); });
            event.target.closest('.profile-tab-btn').classList.add('active');
        }

        function renderProfile() {
            var guest = document.getElementById('profileGuest');
            var content = document.getElementById('profileContent');
            if (!gngUser) {
                if (guest) guest.classList.remove('hidden');
                if (content) content.classList.add('hidden');
                return;
            }
            if (guest) guest.classList.add('hidden');
            if (content) content.classList.remove('hidden');
            document.getElementById('profileAvatar').textContent = (gngUser.name || '?').charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = gngUser.name || 'Kullanıcı';
            document.getElementById('profileEmail').textContent = gngUser.email || gngUser.phone || '—';
            var methods = { email: 'E-posta', google: 'Google', sms: 'SMS' };
            document.getElementById('profileMethod').textContent = (methods[gngUser.method] || gngUser.method) + ' ile bağlı';
            document.getElementById('profileEditName').value = gngUser.name || '';
            document.getElementById('profileEditEmail').value = gngUser.email || '';
            // Order history
            var orders = JSON.parse(localStorage.getItem('gng_orders') || '[]');
            var orderList = document.getElementById('profileOrderList');
            if (orders.length === 0) {
                orderList.innerHTML = '<p class="text-neutral-600 text-xs text-center py-8">Henüz siparişiniz bulunmuyor.</p>';
            } else {
                orderList.innerHTML = orders.map(function(o) {
                    return '<div class="border border-white/5 p-4 flex items-center justify-between"><div><p class="text-white text-xs font-bold">' + o.id + '</p><p class="text-neutral-600 text-[10px] font-mono mt-1">' + o.date + ' — ₺' + o.total.toLocaleString() + '</p></div><span class="text-[8px] uppercase tracking-widest font-bold bg-white/10 text-neutral-400 px-2 py-1">' + o.status + '</span></div>';
                }).join('');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function saveProfile() {
            var name = document.getElementById('profileEditName').value.trim();
            var email = document.getElementById('profileEditEmail').value.trim();
            var msg = document.getElementById('profileSaveMsg');
            if (!name) { msg.textContent = 'Ad Soyad gerekli'; msg.classList.add('show'); return; }
            gngUser.name = name;
            if (email) gngUser.email = email;
            saveUser();
            renderProfile();
            updateAuthUI();
            msg.textContent = 'Profil güncellendi';
            msg.classList.add('show');
            setTimeout(function() { msg.classList.remove('show'); }, 3000);
        }

        SHARED.init(true);
        renderProfile();
        document.querySelectorAll('.profile-tab-btn').forEach(function(b) {
            b.addEventListener('click', function(e) {
                document.querySelectorAll('.profile-tab-btn').forEach(function(x) { x.classList.remove('active'); });
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
