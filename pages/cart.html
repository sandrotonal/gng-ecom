<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepet — GNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        main: ['Manrope', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="bg-black text-white font-main" data-page="cart">

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- ═══════════ SITE ═══════════ -->
    <div id="site">

        <div id="gng-nav"></div>

        <div id="gng-cart"></div>

        <div id="gng-auth"></div>

        <!-- ═══ CART PAGE ═══ -->
        <section class="pt-32 pb-24 md:pt-40 md:pb-40">
            <div class="max-w-7xl mx-auto px-5 md:px-10">
                <div class="mb-12">
                    <p class="text-[9px] uppercase tracking-[0.4em] text-neutral-600 font-mono mb-3">// Alışveriş</p>
                    <h1 class="text-4xl md:text-6xl font-black tracking-tighter uppercase">SEPETİN</h1>
                </div>

                <div class="grid lg:grid-cols-3 gap-12">
                    <!-- Cart Items -->
                    <div class="lg:col-span-2">
                        <div id="cartPageItems" class="space-y-4">
                            <!-- Cart items will be dynamically loaded here -->
                        </div>

                        <div id="cartPageEmpty" class="text-center py-20 hidden">
                            <p class="text-neutral-600 text-sm mb-4">Sepetiniz boş</p>
                            <a href="../index.html#drops" class="inline-block bg-white text-black px-8 py-3 text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-neutral-200 transition-colors">
                                Alışverişe Başla
                            </a>
                        </div>

                        <div id="cartPageActions" class="mt-8 flex gap-4">
                            <a href="../index.html#drops" class="flex-1 border border-white/10 text-white py-3 text-[10px] uppercase tracking-[0.2em] font-bold hover:border-white/30 transition-colors inline-block text-center">
                                Alışverişe Devam Et
                            </a>
                        </div>
                    </div>

                    <!-- Order Summary -->
                    <div class="lg:col-span-1">
                        <div class="border border-white/5 p-6 sticky top-24">
                            <h2 class="text-[10px] uppercase tracking-[0.3em] text-white font-bold mb-6">SİPARİŞ ÖZETİ</h2>
                            
                             <div class="space-y-4 mb-6">
                                 <div class="flex justify-between">
                                     <span class="text-neutral-500 text-xs">Ara Toplam</span>
                                     <span id="cartSubtotal" class="font-mono font-bold text-sm">₺0</span>
                                 </div>
                                 <div class="flex justify-between">
                                     <span class="text-neutral-500 text-xs">Kargo</span>
                                     <span id="cartShipping" class="font-mono font-bold text-sm">₺49</span>
                                 </div>
                                 <div class="border-t border-white/5 pt-4 flex justify-between">
                                     <span class="text-white text-xs font-bold">Toplam</span>
                                     <span id="cartTotal" class="font-mono font-bold text-lg">₺49</span>
                                 </div>
                             </div>

                            <a href="checkout.html" class="w-full bg-white text-black py-4 text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-neutral-200 transition-colors inline-block text-center mb-4">
                                Ödemeye Geç
                            </a>

                            <p class="text-neutral-600 text-[10px] text-center">
                                ₺1.500 üzeri siparişlerde kargo ücretsiz.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div id="gng-footer"></div>

    </div>

    <script src="../js/shared.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/pages.js"></script>
    <script>SHARED.init(true);</script>
</body>
</html>
