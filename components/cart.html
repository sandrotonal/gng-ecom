<!-- Cart Box -->
<div id="cartBox" class="fixed top-0 right-0 h-full w-full max-w-sm bg-black border-l border-white/5 z-50">
    <div class="flex items-center justify-between p-6 border-b border-white/5">
        <span class="text-[10px] uppercase tracking-[0.3em] font-bold">Sepet</span>
        <button onclick="closeCart()" class="text-neutral-500 hover:text-white transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>
    
    <div id="cartItems" class="p-6" style="max-height:calc(100vh - 160px); overflow-y:auto;">
        <div id="cartEmpty" class="text-center py-20">
            <p class="text-neutral-600 text-xs">Sepetiniz boş</p>
        </div>
        <div id="cartList" class="space-y-3"></div>
    </div>
    
    <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-white/5">
        <div class="flex justify-between mb-4">
            <span class="text-neutral-500 text-xs">Toplam</span>
            <span id="cartTot" class="font-mono font-bold text-sm">₺0</span>
        </div>
        <a href="pages/cart.html" class="w-full bg-white text-black py-3 text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-neutral-200 transition-colors inline-block text-center">Sepeti Görüntüle</a>
    </div>
</div>

<!-- Cart Overlay -->
<div id="cartOv" class="fixed inset-0 bg-black/70 z-40 hidden" onclick="closeCart()"></div>
