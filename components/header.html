<header class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/5">

        <!-- Logo -->
        <a href="index.html" class="font-mono font-bold text-lg md:text-xl text-white tracking-tight">GNG</a>
        
        <!-- Desktop Navigation -->
        <nav class="hidden lg:flex items-center gap-8">
            <a href="index.html#drops" class="text-[10px] uppercase tracking-[0.25em] text-neutral-500 hover:text-white transition-colors duration-300">Drops</a>
            <a href="index.html#about" class="text-[10px] uppercase tracking-[0.25em] text-neutral-500 hover:text-white transition-colors duration-300">Hakkında</a>

        <div class="flex items-center gap-4">
            <!-- Cart Button -->
            <button onclick="openCart()" class="relative p-2 text-neutral-500 hover:text-white transition-colors">

            <a href="pages/account.html" class="hidden md:block p-2 text-neutral-500 hover:text-white transition-colors">

            <!-- Mobile Menu Button -->
            <button class="lg:hidden p-2 text-white" onclick="toggleMobileMenu()">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
        </div>
